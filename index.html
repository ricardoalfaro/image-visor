<!doctype html>
<html lang="es" data-theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Viewer Pro</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <div id="appNotice" class="app-notice" role="status" aria-live="polite" aria-hidden="true">
        <i id="appNoticeIcon" class="fa-solid fa-circle-info" aria-hidden="true"></i>
        <span id="appNoticeText"></span>
      </div>
      <nav class="app-rail" aria-label="Paneles">
        <button id="menuButton" class="icon-button rail-button" type="button" aria-label="Abrir carpetas" aria-controls="recentSidebar" aria-expanded="false" aria-pressed="false" title="Carpetas">
          <i class="fa-solid fa-folder-tree" aria-hidden="true"></i>
        </button>
        <button id="adjustmentsButton" class="icon-button rail-button" type="button" aria-label="Abrir controles de imagen" aria-controls="recentSidebar" aria-expanded="false" aria-pressed="false" title="Controles">
          <i class="fa-solid fa-sliders" aria-hidden="true"></i>
        </button>
      </nav>
      <section class="viewer-layout" aria-label="Visualizador de imágenes">
        <div class="top-actions">
          <button id="themeToggleButton" class="icon-button theme-toggle" type="button" aria-label="Modo automático">
            <svg class="theme-icon" data-theme-icon="light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg>
            <svg class="theme-icon" data-theme-icon="auto" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
            <svg class="theme-icon" data-theme-icon="dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A7.5 7.5 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"></path></svg>
          </button>
        </div>
        <div class="welcome-copy">
          <div class="welcome-panel">
            <div class="welcome-title">
              <svg class="welcome-frame" viewBox="0 0 760 560" aria-hidden="true">
                <defs>
                  <linearGradient id="welcomeFrameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff4d6d"></stop>
                    <stop offset="24%" stop-color="#ffb703"></stop>
                    <stop offset="48%" stop-color="#2ec4b6"></stop>
                    <stop offset="72%" stop-color="#3a86ff"></stop>
                    <stop offset="100%" stop-color="#8338ec"></stop>
                  </linearGradient>
                </defs>
                <rect class="welcome-frame-line" x="4" y="4" width="752" height="552" rx="32"></rect>
              </svg>
              <h1><span>Image</span><span>Viewer Pro</span></h1>
            </div>
          </div>
        </div>

        <section id="stage" class="stage is-hidden">
          <button id="previousButton" class="nav-button previous is-hidden" type="button" aria-label="Imagen anterior" disabled hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>

          <figure id="photoFrame" class="photo-frame">
            <button id="closeViewerButton" class="close-viewer-button" type="button" aria-label="Cerrar visualizador">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>
            <img id="placeholderImage" class="placeholder-image" src="assets/placeholder.jpeg" alt="">
            <div id="imageViewport" class="image-viewport is-hidden">
              <img id="activeImage" alt="">
              <video id="activeVideo" class="is-hidden" controls playsinline></video>
              <div class="image-overlay" aria-hidden="true">
                <span id="activePosition" class="overlay-text overlay-right"></span>
              </div>
              <div id="zoomSelection" class="zoom-selection is-hidden" aria-hidden="true"></div>
              <button id="fullscreenAdjustmentsButton" class="icon-button fullscreen-adjustments-button" type="button" aria-label="Abrir controles de imagen" aria-controls="recentSidebar" aria-expanded="false" aria-pressed="false">
                <i class="fa-solid fa-sliders" aria-hidden="true"></i>
              </button>
              <div class="controls" aria-label="Controles del visualizador">
                <div class="control-group control-group-primary">
                  <button id="favoriteButton" class="icon-button favorite-button" type="button" disabled aria-label="Agregar a favoritos" aria-pressed="false">
                    <i class="fa-regular fa-star" aria-hidden="true"></i>
                  </button>
                  <button id="playButton" class="icon-button" type="button" disabled aria-label="Reproducir">
                    <i class="fa-solid fa-play" aria-hidden="true"></i>
                  </button>
                  <button id="stopButton" class="icon-button" type="button" disabled aria-label="Detener">
                    <i class="fa-solid fa-stop" aria-hidden="true"></i>
                  </button>
                  <button id="shuffleButton" class="icon-button" type="button" disabled aria-label="Aleatorio" aria-pressed="false">
                    <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
                  </button>
                </div>
                <div class="control-group control-group-tools">
                  <button id="zoomOutButton" class="icon-button" type="button" disabled aria-label="Alejar">
                    <i class="fa-solid fa-magnifying-glass-minus" aria-hidden="true"></i>
                  </button>
                  <button id="resetZoomButton" class="button zoom-value" type="button" disabled>100%</button>
                  <button id="zoomInButton" class="icon-button" type="button" disabled aria-label="Acercar">
                    <i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i>
                  </button>
                  <button id="fullscreenButton" class="icon-button" type="button" disabled aria-label="Pantalla completa">
                    <i class="fa-solid fa-expand" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
            </div>
          </figure>

          <nav id="folderNav" class="folder-nav is-hidden" aria-label="Subcarpetas"></nav>

          <button id="nextButton" class="nav-button next is-hidden" type="button" aria-label="Imagen siguiente" disabled hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </section>
      </section>

      <input id="folderInput" type="file" accept="image/*,video/mp4,video/quicktime,video/mpeg,.m4v,.mov,.mp4,.mpeg,.mpg,.avif" webkitdirectory multiple>

      <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
      <aside id="recentSidebar" class="recent-sidebar" aria-label="Menu lateral" aria-hidden="true">
        <div class="sidebar-header">
          <h2 id="sidebarTitle">Carpetas</h2>
          <button id="closeSidebarButton" class="icon-button" type="button" aria-label="Cerrar menu">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div id="foldersPanel" class="sidebar-panel" data-sidebar-panel="folders">
          <section class="sort-section" aria-label="Ordenamiento">
            <div class="sort-control">
              <label for="sortSelect">Ordenar por</label>
              <div class="select-wrapper">
                <select id="sortSelect">
                  <option value="name">Nombre</option>
                  <option value="dateDesc">Más recientes primero</option>
                  <option value="dateAsc">Más antiguas primero</option>
                </select>
                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
              </div>
            </div>
          </section>
          <section class="favorite-folder-section" aria-labelledby="favoritePhotosTitle">
            <button id="favoriteFolderButton" class="favorite-folder-button" type="button" disabled>
              <i class="fa-solid fa-folder" aria-hidden="true"></i>
              <span id="favoritePhotosTitle">Favoritos</span>
              <span id="favoritePhotosCount" class="sidebar-count" aria-label="0 favoritos">0</span>
            </button>
          </section>
          <section class="recent-section recent-folders-section" aria-labelledby="recentFoldersTitle">
            <div class="recent-section-header">
              <h3 id="recentFoldersTitle">Carpetas</h3>
              <button id="clearRecentFoldersButton" class="clear-recent-button" type="button" aria-label="Limpiar carpetas" title="Limpiar carpetas">
                <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
              </button>
            </div>
            <ol id="recentFoldersList" class="recent-list"></ol>
            <p id="emptyRecentFolders" class="empty-recent">Aun no hay carpetas.</p>
          </section>
          <div class="sidebar-footer">
            <button id="sidebarImportButton" class="button primary welcome-button" style="width: 100%;">Importar una carpeta</button>
          </div>
        </div>
        <div id="adjustmentsPanel" class="sidebar-panel is-hidden" data-sidebar-panel="adjustments">
          <section class="adjustments-section" aria-label="Ajustes temporales de imagen">
            <p id="adjustmentsEmptyState" class="adjustments-empty">Selecciona una imagen para ajustar su vista.</p>
            <div class="adjustment-list">
              <label class="adjustment-control">
                <span>Brillo</span>
                <input type="range" min="50" max="150" value="100" step="1" data-image-adjustment="brightness">
                <output data-adjustment-output="brightness">100%</output>
              </label>
              <label class="adjustment-control">
                <span>Contraste</span>
                <input type="range" min="50" max="180" value="100" step="1" data-image-adjustment="contrast">
                <output data-adjustment-output="contrast">100%</output>
              </label>
              <label class="adjustment-control">
                <span>Saturación</span>
                <input type="range" min="0" max="200" value="100" step="1" data-image-adjustment="saturate">
                <output data-adjustment-output="saturate">100%</output>
              </label>
              <label class="adjustment-control">
                <span>Tono</span>
                <input type="range" min="-180" max="180" value="0" step="1" data-image-adjustment="hue">
                <output data-adjustment-output="hue" data-adjustment-unit="°">0°</output>
              </label>
              <label class="adjustment-control">
                <span>Exposición</span>
                <input type="range" min="-2" max="2" value="0" step="0.1" data-image-adjustment="exposure">
                <output data-adjustment-output="exposure" data-adjustment-unit="EV">0.0 EV</output>
              </label>
              <label class="adjustment-control">
                <span>Enfoque</span>
                <input type="range" min="0" max="100" value="0" step="1" data-image-adjustment="sharpen">
                <output data-adjustment-output="sharpen">0%</output>
              </label>
            </div>
          </section>
          <div class="sidebar-footer">
            <button id="resetAdjustmentsButton" class="button" type="button" style="width: 100%;">Restablecer ajustes</button>
          </div>
        </div>
      </aside>
    </main>

    <svg width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="sharpenFilter" color-interpolation-filters="sRGB">
        <feConvolveMatrix id="sharpenKernel" order="3" preserveAlpha="true" edgeMode="duplicate" kernelMatrix="0 0 0 0 1 0 0 0 0"></feConvolveMatrix>
      </filter>
    </svg>

    <script type="module" src="app.js"></script>
  </body>
</html>
